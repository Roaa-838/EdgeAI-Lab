name: Source tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight core and tests
        run: python -m pip install -e '.[dev]'
      - name: Test source and fixtures
        run: python -m pytest -q
      - name: Smoke test (no research accuracy)
        run: python -m edgeai smoke-test
